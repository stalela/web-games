<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lalela Web Games - Educational games for children">
    <meta name="theme-color" content="#0062FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lalela Games">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Basic reset and loading styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', 'Inter', sans-serif;
            background-color: #FDFAED; /* Warm Cream background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Ensure canvas has proper background */
        #game-container canvas {
            background-color: #FDFAED;
        }


        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
        }

        /* GCompris-style search bar */
        #search-input {
            position: absolute;
            top: 145px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 600px;
            min-width: 280px;
            height: 50px;
            padding: 0 20px;
            font-size: 22px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            text-align: center;
            color: #4a4a4a;
            background-color: #FFFFFF;
            border: 2px solid #cccccc;
            border-radius: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            outline: none;
            z-index: 1000;
            display: none;
        }

        #search-input::placeholder {
            color: #888888;
            font-weight: 500;
        }

        #search-input:focus {
            border-color: #4ECDC4;
            box-shadow: 0 4px 12px rgba(78, 205, 196, 0.3);
        }
    </style>
</head>
<body>
    <input type="text" id="search-input" placeholder="Search specific activities">
    <div id="game-container"></div>

    <!-- Game scripts will be injected here by webpack -->
</body>
</html>
